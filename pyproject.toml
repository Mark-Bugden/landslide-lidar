[project]
name = "landslide"
version = "0.1.0"
description = "Independent replication of a pre-registered landslide-recognition test on Czech DMR 5G LiDAR"
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "torch==2.14.1+cu130",
    "torchvision==0.29.1+cu130",
    "numpy==2.5.5",
    "scipy==1.18.1",
    "pandas==3.1.1",
    "pyarrow==26.0.1",
    "geopandas==1.2.0",
    "shapely==2.2.0",
    "pyproj==3.8.0",
    "rasterio==1.5.2",
    "pyogrio==0.13.0",
    "scikit-learn==1.9.1",
    "matplotlib==3.11.2",
    "pillow==13.0.0",
    "requests==2.34.2",
    "tqdm==4.70.1",
]

[dependency-groups]
dev = ["pytest==9.2.0"]

[tool.uv]
package = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/landslide"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "needs_data: requires the real cached data under data/ (skipped when it is absent)",
    "needs_cuda: requires a CUDA GPU",
]
